<!DOCTYPE html>

  <style>
    .accordion-content { transition: max-height 0.3s ease-out; }
    .thumbnail-img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; cursor: pointer; }
  </style>

<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <!-- CABEÇALHO -->
  <header class="bg-indigo-900 text-white p-4 shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">

        <h1 class="text-xl font-bold flex items-center gap-2">
          <i class="fa-solid fa-boxes-stacked"></i> Inventário de Património
        </h1>
        <p class="text-xs text-indigo-200">CF Maria Sebastiana - Controle por Ambientes e Subtópicos</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="configurarNuvem()" class="px-3 py-1.5 bg-indigo-700 hover:bg-indigo-600 rounded text-xs font-semibold flex items-center gap-1.5 transition">
          <i class="fa-solid fa-cloud-arrow-up"></i> Configurar Nuvem de Fotos
        </button>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->

      <span><i class="fa-solid fa-triangle-exclamation mr-1"></i> Configura o teu Cloud Name do Cloudinary para permitir o upload público de fotos.</span>
      <button onclick="configurarNuvem()" class="underline font-bold hover:text-amber-900">Configurar Agora</button>
    </div>

    <!-- PAINEL DE MÉTRICAS -->

      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <p class="text-xs text-slate-500 font-medium">Total de Itens</p>
        <p id="kpi-total" class="text-2xl font-bold text-slate-800">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <p class="text-xs text-slate-500 font-medium">Confirmados (OK)</p>
        <p id="kpi-ok" class="text-2xl font-bold text-emerald-600">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <p class="text-xs text-slate-500 font-medium">Sem Património</p>
        <p id="kpi-sem-tag" class="text-2xl font-bold text-amber-600">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <p class="text-xs text-slate-500 font-medium">Não Encontrados / Ausentes</p>
        <p id="kpi-ausente" class="text-2xl font-bold text-rose-600">0</p>
      </div>
    </div>

    <!-- CONTAINER DE AMBIENTES E SUBTÓPICOS -->

  </main>

    function atualizarBannerStatus() {
      const banner = document.getElementById('cloud-status-banner');
      if (cloudName && uploadPreset) {
        banner.className = "mb-6 p-3 bg-emerald-50 border border-emerald-200 rounded-lg text-emerald-800 text-xs flex justify-between items-center";
        banner.innerHTML = `<span><i class="fa-solid fa-cloud-check mr-1"></i> Nuvem Conectada (Cloud Name: <strong>${cloudName}</strong>)</span>
          <button onclick="configurarNuvem()" class="underline text-emerald-900 font-semibold">Alterar Configuração</button>`;
      }
    }

    function configurarNuvem() {
      const cName = prompt("Digita o teu Cloud Name do Cloudinary:", cloudName);
      if (cName !== null) {
        const uPreset = prompt("Digita o teu Upload Preset (Unsigned) do Cloudinary:", uploadPreset);
        if (uPreset !== null) {
          cloudName = cName.trim();
          uploadPreset = uPreset.trim();
          localStorage.setItem('cloud_name', cloudName);
          localStorage.setItem('upload_preset', uploadPreset);
          atualizarBannerStatus();
          alert("Configurações salvas!");
        }
      }
    }

    function renderizarInventario() {
      const container = document.getElementById('ambientes-container');
      container.innerHTML = '';

      let totalGeral = 0, totalOk = 0, totalSemTag = 0, totalAusente = 0;
      let fotosSalvas = JSON.parse(localStorage.getItem('patrimonio_fotos') || '{}');

      dadosInventario.forEach((amb, ambIdx) => {
        let ambHTML = `
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="bg-slate-800 text-white p-4 flex justify-between items-center cursor-pointer select-none" onclick="toggleAmbiente(${ambIdx})">
              <h2 class="text-base font-bold flex items-center gap-2">
                <i class="fa-solid fa-door-open text-indigo-400"></i> ${amb.ambiente}
              </h2>
              <i id="icon-amb-${ambIdx}" class="fa-solid fa-chevron-down transition-transform"></i>
            </div>
            <div id="amb-content-${ambIdx}" class="p-4 space-y-4 ${ambIdx === 0 ? '' : 'hidden'}">
        `;

        amb.topicos.forEach((topico) => {
          ambHTML += `
            <div class="border border-slate-200 rounded-lg overflow-hidden bg-slate-50">
              <div class="bg-slate-200/80 px-3 py-2 border-b border-slate-200 font-semibold text-xs text-slate-700 flex justify-between">
                <span><i class="fa-solid fa-folder text-indigo-600 mr-1.5"></i> ${topico.nome}</span>
                <span class="text-slate-500 font-normal">${topico.itens.length} item(ns)</span>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                  <thead class="bg-slate-100 text-slate-500 uppercase border-b border-slate-200">
                    <tr>
                      <th class="p-2.5">Item / Descrição</th>
                      <th class="p-2.5">Tombamento / Tag</th>
                      <th class="p-2.5">Status</th>
                      <th class="p-2.5">Observação</th>
                      <th class="p-2.5 text-center">Foto</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-200 bg-white">
          `;

          topico.itens.forEach((item) => {
            totalGeral++;
            if (item.status === 'OK') totalOk++;
            else if (item.status === 'Sem Patrimônio') totalSemTag++;
            else if (item.status === 'Não Encontrado') totalAusente++;

            let badgeClass = item.status === 'OK' ? 'bg-emerald-100 text-emerald-800 border-emerald-300' :
                             item.status === 'Sem Patrimônio' ? 'bg-amber-100 text-amber-800 border-amber-300' :
                             'bg-rose-100 text-rose-800 border-rose-300';

            let fotoUrl = fotosSalvas[item.id] || '';

            ambHTML += `
              <tr class="hover:bg-slate-50 transition">
                <td class="p-2.5 font-medium text-slate-800">${item.desc}</td>
                <td class="p-2.5 font-mono text-slate-600">${item.tag || '<span class="text-slate-300">-</span>'}</td>
                <td class="p-2.5">
                  <span class="px-2 py-0.5 rounded-full border text-[10px] font-bold ${badgeClass}">
                    ${item.status}
                  </span>
                </td>
                <td class="p-2.5 text-slate-500">${item.obs || ''}</td>
                <td class="p-2.5 text-center">
                  <div id="foto-container-${item.id}" class="flex items-center justify-center">
                    ${fotoUrl ? 
                      `<img src="${fotoUrl}" onclick="abrirFotoModal('${fotoUrl}', '${item.desc}')" class="thumbnail-img border border-slate-300 hover:scale-105 transition shadow-sm" title="Clique para expandir">` : 
                      `<button onclick="fazerUploadFoto('${item.id}')" id="btn-upload-${item.id}" class="px-2 py-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 rounded text-[11px] font-medium flex items-center gap-1 mx-auto transition">
                        <i class="fa-solid fa-camera"></i> Anexar Foto
                       </button>`
                    }
                  </div>
                </td>
              </tr>
            `;
          });

          ambHTML += `
                  </tbody>
                </table>
              </div>
            </div>
          `;
        });

        ambHTML += `
            </div>
          </div>
        `;

        container.innerHTML += ambHTML;
      });

      // Atualiza os contadores KPI
      document.getElementById('kpi-total').innerText = totalGeral;
      document.getElementById('kpi-ok').innerText = totalOk;
      document.getElementById('kpi-sem-tag').innerText = totalSemTag;
      document.getElementById('kpi-ausente').innerText = totalAusente;
    }

    function toggleAmbiente(idx) {
      const content = document.getElementById(`amb-content-${idx}`);
      const icon = document.getElementById(`icon-amb-${idx}`);
      if (content.classList.contains('hidden')) {
        content.classList.remove('hidden');
        icon.classList.add('rotate-180');
      } else {
        content.classList.add('hidden');
        icon.classList.remove('rotate-180');
      }
    }

    async function fazerUploadFoto(itemId) {
      if (!cloudName || !uploadPreset) {
        alert("Por favor, clica no botão 'Configurar Nuvem de Fotos' e digita o teu Cloud Name e Upload Preset.");
        configurarNuvem();
        return;
      }

      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', uploadPreset);

        const btn = document.getElementById(`btn-upload-${itemId}`);
        if(btn) btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> A enviar...`;

        try {
          const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
            method: 'POST',
            body: formData
          });

          const data = await response.json();
          if (data.secure_url) {
            salvarUrlFotoItem(itemId, data.secure_url);
          } else {
            alert("Erro ao enviar imagem. Verifica se o Cloud Name e Upload Preset estão corretos.");
            if(btn) btn.innerHTML = `<i class="fa-solid fa-camera"></i> Anexar Foto`;
          }
        } catch (error) {
          console.error("Erro no upload:", error);
          alert("Erro de conexão ao enviar imagem.");
          if(btn) btn.innerHTML = `<i class="fa-solid fa-camera"></i> Anexar Foto`;
        }
      };
      input.click();
    }

    function salvarUrlFotoItem(itemId, url) {
      let fotosSalvas = JSON.parse(localStorage.getItem('patrimonio_fotos') || '{}');
      fotosSalvas[itemId] = url;
      localStorage.setItem('patrimonio_fotos', JSON.stringify(fotosSalvas));
      
      const container = document.getElementById(`foto-container-${itemId}`);
      if (container) {
        container.innerHTML = `
          <img src="${url}" onclick="abrirFotoModal('${url}', 'Foto do Item')" class="thumbnail-img border border-slate-300 hover:scale-105 transition shadow-sm" title="Clique para expandir">
        `;
      }
    }

    function abrirFotoModal(url, legenda) {
      document.getElementById('modal-img-element').src = url;
      document.getElementById('modal-img-caption').innerText = legenda;
      document.getElementById('foto-modal').classList.remove('hidden');
    }

    function fecharFotoModal() {
      document.getElementById('foto-modal').classList.add('hidden');
    }

    window.addEventListener('DOMContentLoaded', () => {
      atualizarBannerStatus();
      renderizarInventario();
    });
  </script>
</body>
</html>
